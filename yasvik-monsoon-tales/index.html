    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script>
      (function () {
        if (!/^\/admin(\/|$)/.test(location.pathname)) return;
        var link = document.getElementById('yasvik-pwa-manifest');
        if (link) link.href = '/manifest-admin.json';
        document.title = 'Yasvik Admin';
        var titleMeta = document.createElement('meta');
        titleMeta.name = 'apple-mobile-web-app-title';
        titleMeta.content = 'Yasvik Admin';
        document.head.appendChild(titleMeta);
        var theme = document.querySelector('meta[name="theme-color"]');
        if (theme) theme.content = '#3d342c';
      })();
    </script>
    <link rel="canonical" href="https://www.yasvik.com/" />
