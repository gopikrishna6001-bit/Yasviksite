  <script id="yasvik-chunk-recovery">
      (function () {
        var STORAGE_KEY = 'yasvik-chunk-reload';
        function reloadOnce() {
          if (sessionStorage.getItem(STORAGE_KEY)) return false;
          sessionStorage.setItem(STORAGE_KEY, '1');
          var url = new URL(window.location.href);
          url.searchParams.set('v', Date.now().toString(36));
          window.location.replace(url.toString());
          return true;
        }
        window.addEventListener('vite:preloadError', function (event) {
          event.preventDefault();
          reloadOnce();
        });
        window.addEventListener('error', function (event) {
          var target = event.target;
          if (!target) return;
          var tag = String(target.tagName || '').toUpperCase();
          if (tag === 'SCRIPT') {
            if (String(target.type || '').toLowerCase() !== 'module') return;
            reloadOnce();
            return;
          }
          // Stale HTML after deploy can point at a missing hashed CSS file → unstyled / "distributed" layout.
          if (tag === 'LINK' && String(target.rel || '').toLowerCase() === 'stylesheet') {
            var href = String(target.href || '');
            if (href.indexOf('/assets/') !== -1) reloadOnce();
          }
        }, true);
        window.addEventListener('load', function () {
          try {
            var sheet = Array.prototype.find.call(document.styleSheets || [], function (s) {
              return s && s.href && String(s.href).indexOf('/assets/') !== -1;
            });
            if (!sheet || !sheet.cssRules || sheet.cssRules.length < 50) reloadOnce();
          } catch (e) {
            // Opaque / blocked stylesheet — treat as broken after deploy.
            reloadOnce();
          }
        });
        window.addEventListener('pageshow', function (event) {
          if (event.persisted) sessionStorage.removeItem(STORAGE_KEY);
        });
      })();
    </script>
