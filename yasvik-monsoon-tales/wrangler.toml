name = "yasvik-app-api"
main = "cloudflare/worker.js"
compatibility_date = "2026-05-27"
workers_dev = true
account_id = "41871e772a12ed19e7353a9c071aa5f0"

routes = [
  { pattern = "www.yasvik.com/api/*", zone_name = "yasvik.com" }
]

[vars]
APP_ENV = "development"
SUPABASE_URL = "https://cpksnpuavywbmhrzglyh.supabase.co"
MEDIA_PUBLIC_BASE = "https://media.yasvik.com"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "yasvik-media"

# Secrets must be set with:
# wrangler secret put SUPABASE_SERVICE_ROLE_KEY
# wrangler secret put RESEND_API_KEY
# wrangler secret put RAZORPAY_KEY_ID
# wrangler secret put RAZORPAY_KEY_SECRET
# wrangler secret put RAZORPAY_WEBHOOK_SECRET
# Optional:
# wrangler secret put EMAIL_FROM
#
# Cloudflare Pages build env (Settings → Environment variables):
# VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_GA_MEASUREMENT_ID
